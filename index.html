<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" charset="UTF-8">
    <title>ASL Study - Units</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="media/ASL.svg">
</head>
<body>

    <div class="titleDiv">
        <h1>ASL Study - Unit Selection</h1>
    </div>

    <div id = "upToTen Units" class="divButtons unitButtonDiv1"></div>
    <div id = "upToTwenty Units" class="divButtons unitButtonDiv2"></div>
    <div id = "upToThirty Units" class="divButtons unitButtonDiv3"></div>

		<div class="divButtons bottomDiv">
				<button id="clearButton" class="buttons setupButton" onclick="clearUnits()">Clear</button>

				<button id="whichFront" data-aslorenglish="asl" class="buttons setupButton" onclick="decideImageOfButton('whichFront')">
						<img src="media/ASL.svg" style="height: 100%; width: 100%"/>
				</button>

				<button id="openButton" class="buttons setupButton" onclick="openSelected()">Start</button>

				<button id="copyButton"class="buttons setupButton" onclick="copySelected()">
						<img src="media/CLIPBOARD.svg" style="height: 100%; width: 100%"/>
				</button>
		</div>

    <script src="index.js"></script>

</body>
</html>
