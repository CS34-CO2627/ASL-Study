<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Homepage</title>
    <link rel="stylesheet" href="homePage.css">
    <link rel="icon" type="image/svg+xml" href="media/ASL.svg">
</head>
<body>
    <div class="divButtons"></div>

    <div class="divButtons">
        <div id="bottomButtons" class="bottomDiv">
            <button id="clearButton" class="buttons setupButton" onclick="clearUnits()">Clear</button>
        
            <button id="side" data-uniton="true" class="buttons setupButton" onclick="decideImageOfButton('side')">
                <img src="media/ASL.svg" style="height: 100%; width: 100%"/>
            </button>
        
            <button id="openButton" class="buttons setupButton" onclick ="openSelected()">Start</button>
        
            <button id="copyButton"class="buttons setupButton" onclick="copySelected()">Copy</button>
        </div>
    </div>

    <script src="homePage.js"></script>

</body>
</html>
