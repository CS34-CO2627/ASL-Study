<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" charset="UTF-8">
    <title>ASL Study - Units</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="media/ASL.svg">
</head>
<body>
	<main>
		<div id="headerDiv" class="roundedLargeElement">
				<h1>ASL Study - Units</h1>
		</div>

		<div id = "upToTenUnits" class="roundedLargeElement divButtons"></div>
		<div id = "upToTwentyUnits" class="roundedLargeElement divButtons"></div>
		<div id = "upToThirtyUnits" class="roundedLargeElement divButtons"></div>

		<div id="setupContainer" class="roundedLargeElement divButtons">
				<div id="bottomButtons" class="bottomDiv">
						<button id="clearButton" class="buttons setupButton" onclick="clearUnits()">
								<!--https://fontawesome.com/icons/classic/regular/trash-can-->
								<img src="media/CLEAR.svg" class="buttonIcon"/>
						</button>

						<button id="whichFront" data-aslorenglish="asl" class="buttons setupButton" onclick="decideImageOfButton('whichFront')">
								<img src="media/ASL.svg" class="buttonIcon"/>
						</button>

						<button id="openButton" class="buttons setupButton" onclick="openSelected()">Start</button>

						<button id="copyButton"class="buttons setupButton" onclick="copySelected()">
								<img src="media/CLIPBOARD.svg" class="buttonIcon"/>
						</button>
						<dialog id="copy">
								<p>Content copied to clipboard!</p>
								<button class="close-btn" aria-label="close">&times;</button>
						</dialog>
						<dialog id="notEnoughUnits">
								<p>Not enough units selected!</p>
								<button class="close-btn" aria-label="close">&times;</button>
						</dialog>
				</div>
		</div>
	</main>

    <script src="index.js"></script>

    <footer>
      <p>&copy PHHS Computer Science 3/4 CO '27</p>


    </footer>

</body>
</html>
