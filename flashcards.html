<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" charset="UTF-8">
  <title>ASL Study - Flashcards</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" id="favicon" type="image/svg+xml" href="media/ASL.svg">
</head>
<body id = "body">
  <div id = "fullcard">
    <div id ="flashcardsFlexDiv">
      <button onclick="previousCard()" id="previousCardButton">Previous</button>
      <div id="perspectiveCardDiv" onclick="flip(this)">
        <button id="cardInfoButton">
          <p id="cardInfoP"></p>
        </button>
      </div>
      <button onclick="nextCard()" id="nextCardButton">Next</button>
    </div>

    <div class="divButtons optionButtonDiv">
      <div id="bottomButtons" class="bottomDiv">
        <button class="buttons setupButton" onclick="shuffle()">Shuffle</button>

        <button id="whichFront" data-aslorenglish="asl" class="buttons setupButton" onclick="backflip()">
          <img src="media/ASL.svg" class="buttonIcon"/>
        </button>

        <button class="buttons setupButton" onclick="goBack()"><img src="media/Home.png" class="buttonIcon"/></button>
      </div>
    </div>
  </div>

  <script src="flashcards.js"></script>

</body>
</html>
