<!DOCTYPE html>
<html lang="en">

<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0" charset="UTF-8">
	<title>ASL Study - Flashcards</title>
	<link rel="stylesheet" href="styles.css">
	<link rel="icon" id="favicon" type="image/svg+xml" href="media/ASL.svg">
</head>

<body id="body">
	<div id="fullcard">
		<div id="flashcardsFlexDiv">
			<button title="Go to the previous card" onclick="previousCard()" id="previousCardButton">Previous</button>
			<div id="perspectiveCardDiv" onclick="flip(this)">
				<button title="Flip card" class="card" id="front">
					<p id="frontsideNumber" class="sideNumber"></p>
				</button>

				<button title="Flip card" class="card" id="back">
					<p id="backsideNumber" class="sideNumber"></p>
				</button>
			</div>
			<button title="Go to the next card" onclick="nextCard()" id="nextCardButton">Next</button>
		</div>


		<div class="roundedLargeElement divButtons optionButtonDiv">
			<div id="bottomButtons" class="bottomDiv">
				<button title="Shuffle the cards" class="buttons setupButton" onclick="shuffle()">Shuffle</button>

				<button title="Switch the front between ASL and English" id="whichFront" data-aslorenglish="asl" class="buttons setupButton" onclick="backflip()">
					<img src="media/ASL.svg" class="buttonIcon" />
				</button>

				<button title="Return to unit selection" class="buttons setupButton" onclick="goBack()"><img src="media/Home.png"
						class="buttonIcon" /></button>
			</div>
		</div>
	</div>

	<div class="helpDiv">
		<button title="Tutorial" class="helpButton" onclick="helppopup.showModal()">?</button>
		<dialog id="help">
			<p>How to use the flashcard page.</p>
			<img src="media/ASL_FLASHCARD_HELP.svg" class="homeHelpImg"/>
			<button title="close" class="close-btn" aria-label="close">&times;</button>
		</dialog>
	</div>

	<script src="flashcards.js"></script>

</body>

</html>
