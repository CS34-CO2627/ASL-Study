<!DOCTYPE html>
<html lang="en">

<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0" charset="UTF-8">
	<title>ASL Study - Flashcards</title>
	<link rel="stylesheet" href="styles.css">
	<link rel="icon" id="favicon" type="image/svg+xml" href="media/ASL.svg">
</head>

<body id="flashcardsBody">
<div>
	<div id="flashcardsFlexDiv">
		<button title="Go to the previous card" onclick="previousCard()" id="previousCardButton" class="navigationButton">
			<img src="media/NEXT.svg" class="buttonIcon"/>
		</button>

		<div id="perspectiveCardDiv" onclick="flip(this)">
			<button title="Flip card" class="card" id="front">
				<p id="frontsideNumber" class="sideNumber"></p>
				<p class="mainText"></p>
			</button>

			<button title="Flip card" class="card" id="back">
				<p id="backsideNumber" class="sideNumber"></p>
				<p class="mainText"></p>
			</button>

		</div>
		<button title="Go to the next card" onclick="nextCard()" id="nextCardButton" class="navigationButton">
			<img src="media/NEXT.svg" class="buttonIcon"/>
		</button>
	</div>

	<div class="lazyLoadCard" id="lazy"></div>

	<div class="roundedLargeElement divButtons setupContainer">
		<div id="bottomButtons" class="bottomDiv">
			<button title="Shuffle the cards" class="buttons setupButton" onclick="shuffle()">
				<img src="media/SHUFFLE.svg" class="buttonIcon"/>
			</button>

			<button title="Switch the front between ASL and English" id="whichFront" data-aslorenglish="asl"
			        class="buttons setupButton" onclick="backflip()">
				<img src="media/ASL.svg" class="buttonIcon"/>
			</button>

			<button title="Return to unit selection" class="buttons setupButton" onclick="goBack()"><img
				src="media/HOME.svg" class="buttonIcon"/></button>
		</div>
	</div>
</div>

<div class="helpDiv">
	<button title="Tutorial" class="helpButton" onclick="helppopup.showModal()">?</button>
	<dialog id="help">
		<p>How to use the flashcard page.</p>
		<img src="media/ASL_FLASHCARD_HELP.svg" class="homeHelpImg"/>
		<button title="close" class="close-btn" aria-label="close">&times;</button>
	</dialog>
</div>

<script src="flashcards.js"></script>

</body>

</html>
