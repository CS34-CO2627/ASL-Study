<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" charset="UTF-8">
  <title>ASL Study - Flashcards</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" id="favicon" type="image/svg+xml" href="media/ASL.svg">
</head>
<body>
  <div id = "fullcard">
    <div id ="container">
      <button onclick="previousCard()" id="prev">Previous</button>
      <div id="cardi" onclick="flip(this)">
        <button class="card" id="aslside">
          <p id="aslside-number" class="sideNumber"></p>

          <p id="aslside-answer">Term</p>
        </button>

        <button class="card" id="engside">
          <p id="engside-number" class="sideNumber"></p>

          <p id="engside-answer">Answer</p>
        </button>
      </div>
      <button onclick="nextCard()" id="next">Next</button>
    </div>

    <div class="divButtons extraButtonsDiv optionButtonDiv">
      <div id="bottomButtons" class="bottomDiv">
        <button class="buttons setupButton" onclick="shuffle()">Shuffle</button>

        <button id="whichFront" data-aslorenglish="asl" class="buttons setupButton" onclick="backflip()">
          <img src="media/ASL.svg" class="buttonIcon"/>
        </button>

        <button class="buttons setupButton" onclick="goBack()"><img src="media/Home.png" class="buttonIcon"/></button>
      </div>
    </div>
  </div>

  <script src="flashcards.js"></script>

</body>
</html>
