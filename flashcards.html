<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ASL Study - Flashcards</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" id="favicon" type="image/svg+xml" href="media/ASL.svg">
</head>
<body>

	<div class ="container">
		<div class="cardi" id = "cardi" onclick="flip(this)">
			<button class="card" id="aslside">
				<p id="aslside-number" class="sideNumber"></p>

        <p>Term</p>
      </button>

      <button class="card" id="engside">
        <p id="engside-number" class="sideNumber"></p>

        <p>Answer</p>
      </button>
    </div>
  </div>


  <div class="nav">
    <button onclick="nextCard()" class="next">Next</button>

    <button onclick="previousCard()" class="prev">Previous</button>
  </div>

  <div class="extraButtonsDiv">
    <button class="shuffle" onclick="shuffle()">Shuffle</button>

    <button class="flipStartTerm" onclick="backflip()">Start on English</button>

    <button class="homeButton"onclick="goBack()">Unit Selection</button>
  </div>

  <script src="flashcards.js"></script>

</body>
</html>
